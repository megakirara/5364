<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>彼岸花とゴミ虫 ✧ Neon Edition ✧</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #070720;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
  }
  
  img {
    -webkit-user-drag: none;
    user-select: none;
  }
  
  #back-link {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 3000;
    background: rgba(255, 122, 217, 0.25);
    color: #4de1ff;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-family: 'Courier New', monospace, sans-serif;
    font-weight: bold;
    font-size: 14px;
    box-shadow: 0 0 12px #ff7ad9, inset 0 0 8px #ff7ad9;
    border: 1px solid #4de1ff;
    text-shadow: 0 0 8px #4de1ff;
    transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
  }
  #back-link:hover {
    transform: scale(1.05);
    background: rgba(255, 122, 217, 0.45);
    box-shadow: 0 0 22px #ff7ad9, 0 0 12px #4de1ff;
  }

  .face {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 80px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 0 0 20px #ff7ad9, 0 0 40px #4de1ff;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .celebration {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 0 0 15px #ffe84a, 0 0 30px #ff7ad9;
    pointer-events: none;
    z-index: 1000;
    animation: fadeInOut 3s ease;
  }
  @keyframes fadeInOut {
    0%, 100% { opacity: 0; }
    10%, 90% { opacity: 1; }
  }
  @keyframes rainbowBlink {
    0% { color: #ff7ad9; text-shadow: 0 0 15px #ff7ad9, 0 0 30px #ff7ad9; }
    20% { color: #ffe84a; text-shadow: 0 0 15px #ffe84a, 0 0 30px #ffe84a; }
    40% { color: #b6ff5c; text-shadow: 0 0 15px #b6ff5c, 0 0 30px #b6ff5c; }
    60% { color: #4de1ff; text-shadow: 0 0 15px #4de1ff, 0 0 30px #4de1ff; }
    80% { color: #b68cff; text-shadow: 0 0 15px #b68cff, 0 0 30px #b68cff; }
    100% { color: #ff7ad9; text-shadow: 0 0 15px #ff7ad9, 0 0 30px #ff7ad9; }
  }
</style>
</head>
<body>
<a href="https://megakirara.github.io/-KINOKO/game.html" id="back-link">( 👁️ _ 👁️ )戻る❓</a>

<canvas id="sky"></canvas>
<div class="face" id="face1">（^ ω^）</div>
<div class="face" id="face2">( ﾟ Д ﾟ  )</div>
<div class="celebration" id="celebration"></div>

<script>
"use strict";

document.addEventListener("contextmenu", (e) => {
  e.preventDefault();
});

document.addEventListener("dragstart", (e) => {
  if (e.target.tagName === "IMG") {
    e.preventDefault();
  }
});

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
let w, h;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

let bugClickCount = 0;
let celebrating = false;

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const bugCount = isMobile ? 300 : 700;

// ネオンカラーの虫（ゴミ虫）パレット
const neonBugColors = [
  "#ff7ad9", "#ffe84a", "#4de1ff", "#b6ff5c", "#b68cff", "#ff36bd", "#00eaff"
];
const bugs = Array.from({ length: bugCount }, () => ({
  x: Math.random() * w,
  y: Math.random() * h,
  r: Math.random() * 2.2 + 1.2,
  speed: Math.random() * 0.6 + 0.2,
  color: neonBugColors[Math.floor(Math.random() * neonBugColors.length)],
  phase: Math.random() * Math.PI * 2
}));

let lilyClickCount = 0;
let rainbowOffset = 0;
let lilySize = 1.0;
let lilyRainbowMode = false;

// ネオン彼岸花のカラーパレット
const lilyNeonColors = [
  { color: "rgba(255,122,217,0.85)", shadow: "rgba(255,122,217,1)" },      
  { color: "rgba(77,225,255,0.85)", shadow: "rgba(77,225,255,1)" },  
  { color: "rgba(255,232,74,0.85)", shadow: "rgba(255,232,74,1)" },  
  { color: "rgba(182,140,255,0.85)", shadow: "rgba(182,140,255,1)" },
  { color: "rgba(255,54,189,0.85)", shadow: "rgba(255,54,189,1)" },  
  { color: "rgba(182,255,92,0.85)", shadow: "rgba(182,255,92,1)" }  
];

const neonRainbow = [
  "rgba(255,122,217,0.85)", 
  "rgba(255,232,74,0.85)", 
  "rgba(182,255,92,0.85)",
  "rgba(77,225,255,0.85)",
  "rgba(0,234,255,0.85)",
  "rgba(182,140,255,0.85)",
  "rgba(255,54,189,0.85)"
];

function getCurrentLilyColor(petalIndex) {
  if (lilyRainbowMode) {
    return neonRainbow[(petalIndex + rainbowOffset) % neonRainbow.length];
  }
  
  if (lilyClickCount > 100) {
    return neonRainbow[(petalIndex + rainbowOffset) % neonRainbow.length];
  } else {
    const colorIndex = Math.floor(lilyClickCount / 15) % lilyNeonColors.length;
    return lilyNeonColors[colorIndex].color;
  }
}

function getCurrentLilyShadow() {
  if (lilyRainbowMode || lilyClickCount > 100) {
    return "rgba(255,255,255,1)";
  } else {
    const colorIndex = Math.floor(lilyClickCount / 15) % lilyNeonColors.length;
    return lilyNeonColors[colorIndex].shadow;
  }
}

function drawSpiderLily() {
  const cx = w / 2, cy = h - 80;
  ctx.save();
  ctx.translate(cx, cy);
  
  ctx.scale(lilySize, lilySize);
  
  ctx.strokeStyle = "#4de1ff";
  ctx.lineWidth = 4;
  ctx.shadowBlur = 15;
  ctx.shadowColor = "#4de1ff";
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -120);
  ctx.stroke();

  for (let i = 0; i < 40; i++) {
    const angle = (i / 40) * Math.PI * 2;
    const x = Math.cos(angle) * 55;
    const y = -120 + Math.sin(angle) * 55;
    ctx.beginPath();
    ctx.moveTo(0, -120);
    ctx.lineTo(x, y);
    ctx.strokeStyle = getCurrentLilyColor(i);
    ctx.lineWidth = 2.5;
    ctx.shadowBlur = 16;
    ctx.shadowColor = getCurrentLilyShadow();
    ctx.stroke();
  }
  ctx.restore();
  ctx.shadowBlur = 0;
}

function showFace(faceId) {
  const el = document.getElementById(faceId);
  el.style.opacity = 1;
  setTimeout(() => (el.style.opacity = 0), 800);
}

function celebrate(level = 1) {
  if (celebrating) return;
  celebrating = true;
  
  const celebDiv = document.getElementById('celebration');
  celebDiv.innerHTML = '';
  const faces = ['（^ ω^）', '( ﾟ Д ﾟ  )'];
  
  const rows = Math.ceil(window.innerHeight / 50);
  const cols = Math.ceil(window.innerWidth / 80);
  
  for (let i = 0; i < rows * cols; i++) {
    const span = document.createElement('span');
    span.textContent = faces[Math.floor(Math.random() * faces.length)];
    span.style.margin = '5px';
    
    if (level >= 2) {
      span.style.animation = 'rainbowBlink 0.5s infinite';
      span.style.animationDelay = `${Math.random() * 0.5}s`;
    } else {
      span.style.color = '#ff7ad9';
      span.style.textShadow = '0 0 15px #ff7ad9, 0 0 30px #4de1ff';
    }
    
    celebDiv.appendChild(span);
  }
  
  celebDiv.style.display = 'flex';
  
  setTimeout(() => {
    celebDiv.style.display = 'none';
    celebrating = false;
  }, 3000);
}

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playBeep(frequency = 800, duration = 0.1) {
  initAudio();
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.frequency.value = frequency;
  oscillator.type = 'sine';
  gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  oscillator.start(audioCtx.currentTime);
  oscillator.stop(audioCtx.currentTime + duration);
}

function handleInteraction(e) {
  if (e.target.id === 'back-link') return;

  e.preventDefault();
  const mx = (e.touches ? e.touches[0].clientX : e.clientX);
  const my = (e.touches ? e.touches[0].clientY : e.clientY);
  
  const lilyCx = w / 2;
  const lilyCy = h - 80;
  const lilyDx = mx - lilyCx;
  const lilyDy = my - (lilyCy - 60);
  if (lilyDx * lilyDx + lilyDy * lilyDy < 4900) {
    lilyClickCount++;
    playBeep(1000, 0.15);
    return;
  }
  
  let hit = false;
  bugs.forEach(s => {
    const dx = s.x - mx, dy = s.y - my;
    if (dx * dx + dy * dy < 22500) {
      if (!hit) {
        bugClickCount++;
        playBeep();
        showFace(Math.random() < 0.5 ? "face1" : "face2");
        hit = true;
        
        if (bugClickCount === 10) {
          celebrate(1); 
        } else if (bugClickCount === 50) {
          lilyRainbowMode = true;
          lilySize = 1.3;
        } else if (bugClickCount === 100) {
          celebrate(2); 
        }
      }
    }
  });
}
canvas.addEventListener("click", handleInteraction);
canvas.addEventListener("touchstart", handleInteraction);

function animate() {
  ctx.fillStyle = "rgba(7, 7, 32, 0.3)";
  ctx.fillRect(0, 0, w, h);

  drawSpiderLily();
  
  bugs.forEach(s => {
    s.y += s.speed;
    s.x += Math.sin(s.y / 20 + s.phase) * 0.4;
    if (s.y > h) s.y = -10;
    
    ctx.fillStyle = s.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
  
  if (lilyClickCount > 100 || lilyRainbowMode) {
    rainbowOffset = (rainbowOffset + 1) % 7;
  }
  
  requestAnimationFrame(animate);
}

window.addEventListener('load', initAudio);

animate();
</script>
</body>
</html>
